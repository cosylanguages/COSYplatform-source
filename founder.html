<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0369a1">
  <meta name="description" content="Manage platform users, language access permissions, and administrative settings." data-i18n-placeholder="founder.metaDescription">
  <link rel="icon" href="shared/img/favicon.svg" type="image/svg+xml">
  <title data-i18n="founder.title">Founder Portal · COSYlanguages</title>
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/styles/style.css">
  <style>
    :root {
      --founder-primary: #0f172a;
      --founder-accent: var(--cosy-platform-accent, #0369a1);
      --card-bg: #ffffff;
      --border-color: var(--cosy-color-border, rgba(74, 107, 80, 0.12));
    }

    body {
      background-color: var(--cosy-color-cream, #fdfcf8);
      color: #0f172a;
    }

    .founder-header {
      background: var(--founder-primary);
      color: white;
      padding: 1.5rem 0;
      border-bottom: 1px solid #1e293b;
    }

    .founder-header-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-founder {
      background: #0c4a6e;
      color: #bae6fd;
      padding: 4px 12px;
      border-radius: var(--cosy-radius-full, 100px);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-md, 14px);
      padding: 1.5rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--founder-accent);
    }

    .portal-section {
      background: white;
      border-radius: var(--cosy-radius-md, 14px);
      border: 1px solid var(--border-color);
      padding: 2rem;
      margin-top: 2rem;
      box-shadow: var(--cosy-shadow-sm);
    }

    .portal-section h2 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    .teacher-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .teacher-link-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: var(--cosy-radius-sm, 8px);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .teacher-link-card h4 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }

    .btn-logout {
      background-color: #334155;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Admin Table Styling */
    .admin-table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    .admin-table th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 2px solid #cbd5e1;
    }

    .admin-table td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
    }

    .admin-table select, .admin-table input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      box-sizing: border-box;
    }

    .admin-table select:disabled, .admin-table input:disabled {
      background-color: #f1f5f9;
      color: #475569;
      cursor: not-allowed;
    }

    .btn-save-row {
      background-color: #0369a1;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-save-row:hover {
      background-color: #0369a1;
    }

    .instructions-card {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #0369a1;
    }

    .instructions-card ol {
      margin: 8px 0 0 20px;
      padding: 0;
    }

    .instructions-card li {
      margin-bottom: 4px;
    }
  </style>

    async function initFounderApp() {
      await window.CosyI18n.ready;
      if (window.CosyLangSwitcher) {
        window.CosyLangSwitcher.mount('#header-lang-switcher');
      }

      const authData = await window.CosyAuth.requireRole(['founder']);
      if (!authData) return;

      if (authData.profile && window.CosyI18n && typeof window.CosyI18n.recompute === 'function') {
        await window.CosyI18n.recompute(authData.profile);
      }

      window.currentUserId = authData.user ? authData.user.id : null;
      const userEmail = authData.user ? authData.user.email : '';
      const emailText = userEmail || window.CosyI18n.t('common.executive');
      const userInfoEl = document.getElementById('user-info');
      userInfoEl.innerHTML = `<span data-i18n-skip>${window.CosyI18n.t('common.founderLabel', { email: emailText })}</span>`;

      await renderFounderDashboard();
      await loadUserProfiles();
    }

    function toggleHostedSessionsField(userId) {
      const roleSelect = document.getElementById(`role-${userId}`);
      const sessionsInput = document.getElementById(`sessions-${userId}`);
      if (!roleSelect || !sessionsInput) return;

      if (roleSelect.value === 'teacher') {
        sessionsInput.disabled = false;
        sessionsInput.style.display = 'block';
      } else {
        sessionsInput.disabled = true;
        sessionsInput.style.display = 'none';
      }
    }

    async function loadUserProfiles() {
      const container = document.getElementById('profiles-table-container');
      if (!container) return;

      const client = window.CosyAuth.client;
      if (!client) {
        container.innerHTML = `<p style="color: #ef4444;" data-i18n="founder.clientOffline">Client offline</p>`;
        return;
      }

      try {
        const { data: profiles, error } = await client
          .from('profiles')
          .select('id, role, language_access, course_level, hosted_sessions, created_at')
          .order('created_at', { ascending: false });

        if (error) {
          container.innerHTML = `<p style="color: #ef4444;">${window.CosyI18n.t('founder.errFetchingProfiles', { message: `<span data-i18n-skip>${error.message}</span>` })}</p>`;
          return;
        }

        if (!profiles || profiles.length === 0) {
          container.innerHTML = `<p style="color: #64748b;" data-i18n="founder.noProfiles">${window.CosyI18n.t('founder.noProfiles')}</p>`;
          return;
        }

        let html = `
          <div class="admin-table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th data-i18n="founder.thUserId">${window.CosyI18n.t('founder.thUserId')}</th>
                  <th data-i18n="founder.thRole">${window.CosyI18n.t('founder.thRole')}</th>
                  <th data-i18n="founder.thLangAccess">${window.CosyI18n.t('founder.thLangAccess')}</th>
                  <th data-i18n="founder.thCourseLevels">${window.CosyI18n.t('founder.thCourseLevels')}</th>
                  <th data-i18n="founder.thHostedSessions">${window.CosyI18n.t('founder.thHostedSessions')}</th>
                  <th data-i18n="founder.thCreatedAt">${window.CosyI18n.t('founder.thCreatedAt')}</th>
                  <th data-i18n="founder.thAction">${window.CosyI18n.t('founder.thAction')}</th>
                </tr>
              </thead>
              <tbody>
        `;

        profiles.forEach(p => {
          const langsStr = Array.isArray(p.language_access) ? p.language_access.join(', ') : (p.language_access || '');
          const sessionsStr = Array.isArray(p.hosted_sessions) ? p.hosted_sessions.join(', ') : (p.hosted_sessions || '');
          const dateStr = p.created_at ? window.CosyI18n.formatDate(p.created_at) : 'N/A';
          const isTeacher = p.role === 'teacher';
          const isSelf = Boolean(window.currentUserId && p.id === window.currentUserId);

          const cannotChangeOwnTitle = window.CosyI18n.t('founder.cannotChangeOwnRole');
          const phLangs = window.CosyI18n.t('founder.phLangs');
          const phLevels = window.CosyI18n.t('founder.phLevels');
          const phSessions = window.CosyI18n.t('founder.phSessions');

          html += `
            <tr id="profile-row-${p.id}">
              <td style="font-family: monospace; font-size: 0.8rem; color: #64748b;" title="${p.id}" data-i18n-skip>
                ${p.id.substring(0, 8)}...
              </td>
              <td style="width: 120px;">
                <select id="role-${p.id}" ${isSelf ? `disabled title="${cannotChangeOwnTitle}"` : ''} onchange="toggleHostedSessionsField('${p.id}')" data-i18n-skip>
                  <option value="student" ${p.role==='student'?'selected':''}>student</option>
                  <option value="teacher" ${p.role==='teacher'?'selected':''}>teacher</option>
                  <option value="founder" ${p.role==='founder'?'selected':''}>founder</option>
                </select>
              </td>
              <td style="width: 160px;">
                <input type="text" id="langs-${p.id}" value="${langsStr.replace(/"/g, '&quot;')}" placeholder="${phLangs}" data-i18n-placeholder="founder.phLangs" />
              </td>
              <td style="width: 140px;">
                <input type="text" id="levels-${p.id}" value="${(p.course_level || '*').replace(/"/g, '&quot;')}" placeholder="${phLevels}" data-i18n-placeholder="founder.phLevels" />
              </td>
              <td style="width: 180px;">
                <input type="text" id="sessions-${p.id}" value="${sessionsStr.replace(/"/g, '&quot;')}" placeholder="${phSessions}" data-i18n-placeholder="founder.phSessions" ${isTeacher ? '' : 'disabled style="display:none;"'} />
              </td>
              <td style="font-size: 0.8rem; color: #64748b;" data-i18n-skip>
                ${dateStr}
              </td>
              <td>
                <button onclick="saveUserProfile('${p.id}')" id="btn-save-${p.id}" class="btn-save-row" data-i18n="founder.saveBtn">${window.CosyI18n.t('founder.saveBtn')}</button>
                <span id="status-${p.id}" style="font-size: 0.8rem; margin-left: 8px;"></span>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table></div>`;
        container.innerHTML = html;
        window.CosyI18n.applyDom(container);

      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444;">${window.CosyI18n.t('founder.errSystem', { message: `<span data-i18n-skip>${err.message}</span>` })}</p>`;
      }
    }

    async function saveUserProfile(userId) {
      const client = window.CosyAuth.client;
      const statusEl = document.getElementById(`status-${userId}`);
      const btnEl = document.getElementById(`btn-save-${userId}`);

      if (!client) {
        if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444;">${window.CosyI18n.t('founder.clientOffline')}</span>`;
        return;
      }

      const roleSelectEl = document.getElementById(`role-${userId}`);
      const role = roleSelectEl ? roleSelectEl.value : 'student';
      const rawLangs = document.getElementById(`langs-${userId}`).value.trim();
      const course_level = document.getElementById(`levels-${userId}`).value.trim();
      const rawSessions = document.getElementById(`sessions-${userId}`).value.trim();

      let language_access = [];
      if (rawLangs === '*') {
        language_access = ['*'];
      } else if (rawLangs) {
        language_access = rawLangs.split(',').map(s => s.trim()).filter(Boolean);
      }

      let hosted_sessions = [];
      if (role === 'teacher' && rawSessions) {
        hosted_sessions = rawSessions.split(',').map(s => s.trim()).filter(Boolean);
      }

      if (btnEl) btnEl.disabled = true;
      if (statusEl) statusEl.innerHTML = `<span style="color: #0369a1;">${window.CosyI18n.t('founder.savingStatus')}</span>`;

      try {
        const updatePayload = {
          role: role,
          language_access: language_access,
          course_level: course_level,
          hosted_sessions: hosted_sessions,
          updated_at: new Date().toISOString()
        };

        const { data, error } = await client
          .from('profiles')
          .update(updatePayload)
          .eq('id', userId)
          .select('id');

        if (error || !data || data.length !== 1) {
          if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444; font-weight: 600;">${window.CosyI18n.t('founder.notSavedErr')}</span>`;
        } else {
          if (statusEl) statusEl.innerHTML = `<span style="color: #047857; font-weight: 600;">${window.CosyI18n.t('founder.savedSuccess')}</span>`;
          setTimeout(() => { if (statusEl) statusEl.innerHTML = ''; }, 3000);
        }
      } catch (err) {
        if (statusEl) statusEl.innerHTML = `<span style="color: #ef4444; font-weight: 600;">${window.CosyI18n.t('founder.notSavedErr')}</span>`;
      } finally {
        if (btnEl) btnEl.disabled = false;
      }
    }

    window.onload = initFounderApp;
  </script>
</body>
</html>
