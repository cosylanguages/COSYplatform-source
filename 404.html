<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0369a1">
  <meta name="description" content="The requested page could not be found or requires different access permissions." data-i18n-placeholder="notfound.metaDescription">
  <title data-i18n="notfound.title">Page Not Found · COSYlanguages</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script>
    (function() {
      const firstPart = location.pathname.split('/')[1] || '';
      const basePath = (firstPart && !firstPart.includes('.')) ? '/' + firstPart + '/' : '/';
      window.COSY_BASE_PATH = basePath;

      const head = document.head;

      const fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/svg+xml';
      fav.href = basePath + 'shared/img/favicon.svg';
      head.appendChild(fav);

      const css1 = document.createElement('link');
      css1.rel = 'stylesheet';
      css1.href = basePath + 'shared/css/tokens.css';
      head.appendChild(css1);

      const css2 = document.createElement('link');
      css2.rel = 'stylesheet';
      css2.href = basePath + 'shared/styles/style.css';
      head.appendChild(css2);

      const js1 = document.createElement('script');
      js1.async = false;
      js1.src = basePath + 'shared/js/config.js';
      head.appendChild(js1);

      const js2 = document.createElement('script');
      js2.async = false;
      js2.src = basePath + 'shared/js/auth-guard.js';
      head.appendChild(js2);

      const js2b = document.createElement('script');
      js2b.async = false;
      js2b.src = basePath + 'shared/js/auth-sso.js';
      head.appendChild(js2b);

      const js2c = document.createElement('script');
      js2c.async = false;
      js2c.src = basePath + 'shared/js/cms-editor.js';
      head.appendChild(js2c);

      const js3 = document.createElement('script');
      js3.async = false;
      js3.src = basePath + 'shared/js/i18n.js';
      head.appendChild(js3);

      window.mountCosyLangSwitcher = function() {
        if (window.CosyLangSwitcher) {
          const container = document.getElementById('lang-switcher-container');
          if (container && !container.querySelector('.cosy-lang-switcher-select')) {
            window.CosyLangSwitcher.mount(container);
          }
        }
      };

      const js4 = document.createElement('script');
      js4.async = false;
      js4.onload = () => { if (window.mountCosyLangSwitcher) window.mountCosyLangSwitcher(); };
      js4.src = basePath + 'shared/js/lang-switcher.js';
      head.appendChild(js4);
    })();
  </script>
</head>
<body style="background-color: var(--cosy-color-cream, #fdfcf8); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; font-family: var(--cosy-font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);">

  <div style="background: white; border: 1px solid var(--cosy-color-border, #cbd5e1); border-radius: var(--cosy-radius-md, 14px); padding: 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: var(--cosy-shadow-sm, 0 4px 12px rgba(0,0,0,0.05)); position: relative;">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;" id="lang-switcher-container"></div>
    <div style="font-size: 3rem; margin-bottom: 12px;">🔎</div>
    <h1 style="font-size: 1.6rem; font-weight: 700; color: #0f172a; margin: 0 0 12px 0;" data-i18n="notfound.heading">Page not found</h1>
    <p style="color: #64748b; font-size: 0.95rem; line-height: 1.6; margin: 0 0 28px 0;" data-i18n="notfound.message">That page doesn't exist or you may not have access to it.</p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a id="btn-signin" href="#" class="btn btn-outline" style="padding: 10px 20px; text-decoration: none; font-size: 0.9rem; font-weight: 600;" data-i18n="notfound.signIn">Sign in</a>
      <button id="btn-workspace" class="btn" style="background: var(--cosy-platform-accent, #0369a1); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;" data-i18n="notfound.backToWorkspace">Back to your workspace</button>
    </div>
  </div>

  <script>
    if (window.mountCosyLangSwitcher) window.mountCosyLangSwitcher();
    document.addEventListener('DOMContentLoaded', () => {
      const basePath = window.COSY_BASE_PATH || '/';
      const signInBtn = document.getElementById('btn-signin');
      const workspaceBtn = document.getElementById('btn-workspace');

      if (window.mountCosyLangSwitcher) window.mountCosyLangSwitcher();

      if (signInBtn) {
        signInBtn.href = basePath + 'login.html';
      }

      if (workspaceBtn) {
        workspaceBtn.addEventListener('click', async () => {
          let targetPage = 'login.html';
          if (window.CosyAuth && typeof window.CosyAuth.getAuthAndProfile === 'function') {
            try {
              const authData = await window.CosyAuth.getAuthAndProfile();
              if (authData && authData.profile && authData.profile.role) {
                const role = authData.profile.role.toLowerCase();
                if (role === 'founder') targetPage = 'founder.html';
                else if (role === 'teacher') targetPage = 'teacher.html';
                else targetPage = 'student.html';
              }
            } catch (e) {}
          }
          window.location.href = basePath + targetPage;
        });
      }
    });
  </script>
</body>
</html>
