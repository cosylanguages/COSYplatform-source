<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0369a1">
  <meta name="description" content="Sign in to your COSYlanguages student, teacher, or founder account." data-i18n-placeholder="login.metaDescription">
  <link rel="icon" href="shared/img/favicon.svg" type="image/svg+xml">
  <title data-i18n="login.title">Sign in · COSYlanguages</title>
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/styles/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script src="shared/js/config.js"></script>
  <script src="shared/js/auth-sso.js"></script>
  <script src="shared/js/cms-editor.js"></script>
  <script src="shared/js/i18n.js"></script>
  <script src="shared/js/lang-switcher.js"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      position: relative;
    }
    .login-card-top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 8px 0;
    }
    .login-header p {
      color: #64748b;
      font-size: 0.9rem;
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-submit:hover {
      background-color: #0369a1;
    }
    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .error-banner {
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-card-top-bar" id="lang-switcher-container"></div>

    <div class="login-header">
      <h1 data-i18n-skip>COSYlanguages</h1>
      <p data-i18n="login.subheading">Log in to access your workspace</p>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email" data-i18n="login.emailLabel">Email Address</label>
        <input type="email" id="email" required placeholder="name@domain.com" autocomplete="email" data-i18n-placeholder="login.emailPlaceholder">
      </div>

      <div class="form-group">
        <label for="password" data-i18n="login.passwordLabel">Password</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" data-i18n-placeholder="login.passwordPlaceholder">
      </div>

      <button type="submit" id="submit-btn" class="btn-submit" data-i18n="login.submitBtn">Sign In</button>
    </form>

    <div class="footer-note" data-i18n="login.footerNote">
      Account creation is managed by platform administration.
    </div>
  </div>

  <script>
    let supabaseClient = null;
    (function() {
      const config = window.COSY_CONFIG || {};
      const url = config.SUPABASE_URL || "";
      const key = config.SUPABASE_ANON_KEY || "";
      const isConfigured = Boolean(
        url && key && !url.startsWith("REPLACE_WITH") && !key.startsWith("REPLACE_WITH") && url.startsWith("http")
      );
      if (isConfigured && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(url, key);
        } catch (e) {}
      }
    })();

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBanner = document.getElementById('error-banner');

    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect');

    if (window.CosyLangSwitcher) {
      window.CosyLangSwitcher.mount('#lang-switcher-container');
    }

    function safeRedirect(target) {
      if (!target || typeof target !== 'string') return null;
      try {
        const parsed = new URL(target, window.location.href);
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
        if (parsed.origin !== window.location.origin) return null;

        const loginPath = window.location.pathname;
        const folderPath = loginPath.substring(0, loginPath.lastIndexOf('/') + 1);

        if (!parsed.pathname.startsWith(folderPath)) return null;

        const relPath = parsed.pathname.substring(folderPath.length);
        if (relPath.includes('/')) return null;

        if (relPath !== '' && !relPath.endsWith('.html')) return null;

        return relPath + parsed.search + parsed.hash;
      } catch (e) {
        return null;
      }
    }

    function showError(msgKey, fallbackMsg) {
      const translated = (window.CosyI18n && typeof window.CosyI18n.t === 'function')
        ? window.CosyI18n.t(msgKey)
        : fallbackMsg;
      errorBanner.textContent = (translated && translated !== msgKey) ? translated : fallbackMsg;
      errorBanner.style.display = 'block';
    }

    function hideError() {
      errorBanner.style.display = 'none';
      errorBanner.textContent = '';
    }

    window.CosyI18n.ready.then(() => {
      if (!supabaseClient) {
        showError('login.errNotConfigured', 'Platform not configured. Ask an administrator to set the Supabase details in shared/js/config.js.');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      if (!supabaseClient) {
        showError('login.errNotConfigured', 'Platform not configured. Ask an administrator to set the Supabase details in shared/js/config.js.');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = window.CosyI18n ? window.CosyI18n.t('login.signingIn') : 'Signing in...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          const errMsg = error.message || '';
          if (errMsg.toLowerCase().includes('invalid login credentials') || errMsg.toLowerCase().includes('invalid credentials')) {
            showError('login.errInvalidCredentials', 'Invalid credentials. Please check your email and password.');
          } else {
            showError('login.errInvalidCredentials', errMsg || 'Invalid credentials. Please check your email and password.');
          }
          submitBtn.disabled = false;
          submitBtn.textContent = window.CosyI18n ? window.CosyI18n.t('login.submitBtn') : 'Sign In';
          return;
        }

        if (data && data.user) {
          let targetPage = 'student.html';
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('role, language_access')
            .eq('id', data.user.id)
            .maybeSingle();

          if (profile) {
            if (profile.role) {
              const role = profile.role.toLowerCase();
              if (role === 'founder') targetPage = 'founder.html';
              else if (role === 'teacher') targetPage = 'teacher.html';
              else targetPage = 'student.html';
            }

            // Recompute language with profile and save cosy_ui_lang_last
            if (window.CosyI18n && typeof window.CosyI18n.recompute === 'function') {
              await window.CosyI18n.recompute(profile);
            }
          }

          const safeTarget = safeRedirect(redirectTarget);
          if (safeTarget) {
            window.location.href = safeTarget;
          } else {
            window.location.href = targetPage;
          }
        }
      } catch (err) {
        showError('login.errUnexpected', 'An unexpected error occurred during sign in.');
        submitBtn.disabled = false;
        submitBtn.textContent = window.CosyI18n ? window.CosyI18n.t('login.submitBtn') : 'Sign In';
      }
    });
  </script>
</body>
</html>
